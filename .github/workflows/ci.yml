name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" pandas-stubs
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy talsim --ignore-missing-imports
      - run: pytest -q

  build:
    # Proves the built wheel (not the editable checkout) installs and runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "build>=1.2" "twine>=6.1"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          ./smoke/bin/python - <<'PY'
          import math, os, talsim
          from talsim import ScenarioConfig, run_path

          assert talsim.__file__.startswith(os.environ["RUNNER_TEMP"]), talsim.__file__
          r = run_path(ScenarioConfig(years=1), seed=0)
          assert math.isfinite(r.ending_after_tax_wealth) and r.ending_after_tax_wealth > 0
          print("talsim", talsim.__version__, "from", talsim.__file__)
          PY
          ./smoke/bin/python -m talsim.cli --help
          ./smoke/bin/talsim --help
